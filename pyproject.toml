[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "signaldesk-soc"
version = "0.1.0"
description = "Local security event investigation and detection workbench"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "defusedxml>=0.7,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
signaldesk = "signaldesk.cli:main"

[tool.setuptools.package-data]
signaldesk = ["static/*"]

[tool.setuptools.packages.find]
include = ["signaldesk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
