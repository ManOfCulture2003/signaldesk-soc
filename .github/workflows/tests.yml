name: Verify SignalDesk
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test]" -c requirements-lock.txt
      - run: python -m pytest -q
      - run: python -m pip check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check signaldesk/static/app.js
